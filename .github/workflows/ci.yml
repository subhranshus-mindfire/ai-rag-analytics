name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Coverage Gate
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      ENVIRONMENT: testing
      LLM_PROVIDER: gemini
      GOOGLE_API_KEY: test_key_for_ci_pipeline
      GROQ_API_KEY: test_key_for_ci_pipeline
      DATABASE_URL: sqlite:///./test_ci.db
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Verbose Output
        run: |
          python -m unittest discover -s app/tests -p "test_*.py" -v

      - name: Run Code Coverage Gate (>= 80% Requirement)
        run: |
          python scripts/check_coverage.py

      - name: Run Intent & Security Benchmarks
        run: |
          python -m unittest app/tests/benchmark/test_accuracy_benchmark.py -v

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build
